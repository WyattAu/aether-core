name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FDB_VERSION: "7.3.27"

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        continue-on-error: true
        run: |
          cargo bench --package aether-core --features "wasm,mesh" -- --output-format bencher 2>&1 | tee benchmark-results.txt || true
          # Verify at least one benchmark ran
          if ! grep -q 'test' benchmark-results.txt; then
            echo "WARNING: No benchmark output detected. Trying with fewer features..."
            cargo bench --package aether-core --features "wasm,mesh" -- --output-format bencher 2>&1 | tee benchmark-results.txt || true
          fi
      
      - name: Download previous baseline
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: benchmark-baseline
          path: target/criterion
      
      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          if [ -d "target/criterion" ]; then
            echo "## Performance Comparison" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
             cargo bench --workspace -- --output-format bencher 2>&1 | tee comparison.txt
            
            if grep -q "Performance has regressed" comparison.txt; then
              echo "WARNING: Performance regression detected!" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -A 5 "Performance has regressed" comparison.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "No performance regressions detected" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Generate benchmark report
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Store benchmark result
        if: hashFiles('benchmark-results.txt') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@7ee5534da414fc77bddfd3887ff0564480e088d8
        with:
          tool: 'cargo'
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@${{ github.actor }}'
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-results
          path: |
            benchmark-results.txt
            target/criterion
      
      - name: Update baseline on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-baseline
          path: target/criterion

  regression-check:
    name: Regression Baseline Comparison
    runs-on: ubuntu-latest
    needs: benchmark
    if: needs.benchmark.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-regression-${{ hashFiles('**/Cargo.lock') }}

      - name: Run aether-core benchmarks
        run: |
           cargo bench --package aether-core --bench roadmap_targets --features "wasm,mesh" 2>&1 | tee regression-results.txt

      - name: Download previous baseline
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: benchmark-baseline
          path: target/criterion

      - name: Compare against regression baseline
        run: |
          echo "## Regression Baseline Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          REGRESSION_THRESHOLD=10

          if [ -d "target/criterion" ]; then
            cargo bench --package aether-core --bench roadmap_targets --features "wasm,mesh" \
              --baseline previous --output-format bencher 2>&1 | tee regression-comparison.txt

            if grep -q "Performance has regressed" regression-comparison.txt; then
              echo "### Performance Regression Detected" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -B 2 -A 5 "Performance has regressed" regression-comparison.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Compare against baseline: \`.specs/06_5_regression/baseline_metrics.toml\`" >> $GITHUB_STEP_SUMMARY

              REGRESSION_COUNT=$(grep -c "Performance has regressed" regression-comparison.txt || true)
              if [ "$REGRESSION_COUNT" -gt 0 ]; then
                echo "::warning::$REGRESSION_COUNT benchmark(s) regressed beyond threshold"
              fi
            else
              echo "No performance regressions detected against stored baseline." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No previous baseline found. This run will be stored as the new baseline." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat regression-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload regression results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: regression-results
          path: |
            regression-results.txt
            regression-comparison.txt

  memory-benchmark:
    name: Memory Usage Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Install valgrind
        run: sudo apt-get install -y valgrind

      - name: Build release
        run: cargo build --release --package aether-server --package aether-cli
      
      - name: Run memory benchmark
        run: |
          echo "## Memory Usage Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          valgrind --tool=massif --massif-out-file=massif.out ./target/release/aether-cli --help
          
          if [ -f massif.out ]; then
            ms_print massif.out > memory-report.txt
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 memory-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload memory report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: memory-benchmark
          path: |
            massif.out
            memory-report.txt

  startup-benchmark:
    name: Startup Time Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --package aether-server --package aether-cli
      
      - name: Measure startup time
        run: |
          echo "## Startup Time Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Run | Time (ms) |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|" >> $GITHUB_STEP_SUMMARY
          
          TOTAL=0
          for i in {1..10}; do
            START=$(date +%s%N)
            ./target/release/aether-cli --help > /dev/null 2>&1
            END=$(date +%s%N)
            TIME=$(( (END - START) / 1000000 ))
            TOTAL=$((TOTAL + TIME))
            echo "| $i | $TIME |" >> $GITHUB_STEP_SUMMARY
          done
          
          AVG=$((TOTAL / 10))
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Average startup time: ${AVG}ms**" >> $GITHUB_STEP_SUMMARY

  python-sdk-benchmark:
    name: Python SDK Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sdks/python/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-benchmark
          pip install -e .

      - name: Run benchmarks
        run: pytest tests/performance/ -v --benchmark-only 2>&1 | tee benchmark-results.txt
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: python-sdk-benchmark-results
          path: sdks/python/benchmark-results.txt

  javascript-sdk-benchmark:
    name: JavaScript SDK Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run benchmarks
        run: pnpm exec jest tests/performance/ --verbose 2>&1 | tee benchmark-results.txt
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: js-sdk-benchmark-results
          path: sdks/javascript/benchmark-results.txt

  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmark, regression-check, memory-benchmark, startup-benchmark, python-sdk-benchmark, javascript-sdk-benchmark]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## All Benchmarks Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance (Rust) | ${{ needs.benchmark.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory | ${{ needs.memory-benchmark.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Startup | ${{ needs.startup-benchmark.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python SDK | ${{ needs.python-sdk-benchmark.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript SDK | ${{ needs.javascript-sdk-benchmark.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Check | ${{ needs.regression-check.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
