name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FDB_VERSION: "7.3.27"

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        continue-on-error: true
        run: |
          cargo bench --package aether-core --features "wasm,mesh" --bench registry_bench -- --output-format bencher --warm-up-time 1 --measurement-time 3 2>&1 | tee benchmark-results.txt || true
          # Verify at least one benchmark ran
          if ! grep -q 'test' benchmark-results.txt; then
            echo "WARNING: No benchmark output detected. Trying with fewer features..."
            cargo bench --package aether-core --features "wasm,mesh" --bench registry_bench -- --output-format bencher --warm-up-time 1 --measurement-time 3 2>&1 | tee benchmark-results.txt || true
          fi
      
      - name: Download previous baseline
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: benchmark-baseline
          path: target/criterion
      
      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          if [ -d "target/criterion" ]; then
            echo "## Performance Comparison" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
             cargo bench --package aether-core --features "wasm,mesh" --bench registry_bench -- --output-format bencher --warm-up-time 1 --measurement-time 3 2>&1 | tee comparison.txt
            
            if grep -q "Performance has regressed" comparison.txt; then
              echo "WARNING: Performance regression detected!" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -A 5 "Performance has regressed" comparison.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "No performance regressions detected" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Generate benchmark report
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Store benchmark result
        if: hashFiles('benchmark-results.txt') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@7ee5534da414fc77bddfd3887ff0564480e088d8
        with:
          tool: 'cargo'
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@${{ github.actor }}'
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-results
          path: |
            benchmark-results.txt
            target/criterion
      
      - name: Update baseline on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-baseline
          path: target/criterion

  regression-check:
    name: Regression Baseline Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: benchmark
    if: needs.benchmark.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-regression-${{ hashFiles('**/Cargo.lock') }}

      # Regression detection lives in github-action-benchmark's stored
      # history (gh-pages), not in criterion artifact baselines: comparing
      # a run against its own run's artifact detects nothing, and the
      # roadmap_targets suite cannot fit any job budget. One focused,
      # time-bounded bench, judged against persistent history.
      - name: Run focused benchmark against history
        run: |
          cargo bench --package aether-core --features "wasm,mesh" --bench registry_bench -- \
            --output-format bencher --warm-up-time 1 --measurement-time 3 2>&1 | tee regression-results.txt

      - name: Compare against stored history (alerts + gate)
        if: hashFiles('regression-results.txt') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@7ee5534da414fc77bddfd3887ff0564480e088d8
        with:
          tool: 'cargo'
          output-file-path: regression-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@${{ github.actor }}'

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: regression-results
          path: regression-results.txt
