name: Aether CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-features

      - name: No stubs
        run: |
          ! grep -rn 'generate_mock\|SimulatedLogStreamer\|todo!()' crates/
          echo "No stubs found"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run property tests
        run: cargo test --test property_tests --all-features

      - name: Install wasm32-wasip1 target
        run: echo "Already installed via dtolnay/rust-toolchain targets"

      - name: Check aether-actor compiles to wasm32-wasip1
        run: cargo check --target wasm32-wasip1 -p aether-actor

      - name: Run WASM E2E tests
        run: cargo test -p aether-tests --features wasm --test wasm_e2e_test

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /usr/local/cargo/bin/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace --all-features --html --output-dir target/coverage --fail-under-lines 80 2>&1 | tee coverage-report.txt
          echo ""
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 coverage-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-report.txt
            target/coverage/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit 2>&1 || true

      - name: Audit summary
        if: always()
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          cargo audit 2>&1 | grep -E "(Crate:|Title:|Severity:|Solution:)" >> $GITHUB_STEP_SUMMARY || true

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: License compliance
        run: cargo deny check licenses

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [test, security]
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aether-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.os == 'ubuntu-latest'
        run: strip target/release/aether-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/aether-cli

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: aether-*/aether-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-fdb:
    name: FDB Integration Tests
    runs-on: ubuntu-latest
    needs: check
    services:
      foundationdb:
        image: foundationdb/foundationdb:7.3
        ports:
          - 4500:4500
          - 4501:4501
        env:
          FDB_NETWORK_OPTION_TRACE_LOG_LEVEL: "5"
          FDB_NETWORK_OPTION_TRACE_ENABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/7.3.0/foundationdb-clients_7.3.0-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb
          sudo mkdir -p /etc/foundationdb
          echo "aether-ci:127.0.0.1:4500" | sudo tee /etc/foundationdb/fdb.cluster
          echo -e "trace_enable = 1\ntrace_log_group = aether-ci" | sudo tee /etc/foundationdb/fdb.options

      - name: Wait for FoundationDB to be ready
        run: |
          for i in $(seq 1 30); do
            if fdbcli --exec "status minimal" 2>/dev/null; then
              echo "FDB is ready"
              exit 0
            fi
            echo "Waiting for FDB... ($i/30)"
            sleep 2
          done
          echo "FDB did not become ready in time"
          exit 1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fdb-${{ hashFiles('**/Cargo.lock') }}

      - name: Run FDB integration tests
        env:
          FDB_NETWORK_OPTION_FILE: /etc/foundationdb/fdb.options
        run: cargo test --package aether-core --features fdb -- --ignored fdb_integration_tests

      - name: Run state replication tests
        env:
          FDB_NETWORK_OPTION_FILE: /etc/foundationdb/fdb.options
        run: cargo test --workspace --all-features -- state_replication_test
