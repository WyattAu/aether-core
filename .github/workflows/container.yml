name: Container

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba9e6dc7d6a82ae3ac99f96f9f5b0ea8f369

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@e9d90e5f6e9f1e260c9cdeb2e29d4dbe11b8e3b3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@db97c247a8063ddb20004acedaa4c014d5a41495
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@471d14dc28dbda73b6b29e5a4b6a4a870b2b07a3
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@1c4988873b77425d94b6cb5c6ac09e52f909d10a
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Build image locally for scanning
        run: docker build -t aether-core:scan -f ./Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@8854e74eb5317046bdf8d4a4d37a387affa15d41
        with:
          image-ref: 'aether-core:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@382eb82952427676a27a9c07b9e80514daa2d83c
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-vulnerabilities'

      - name: Run Trivy for exit code
        uses: aquasecurity/trivy-action@8854e74eb5317046bdf8d4a4d37a387affa15d41
        with:
          image-ref: 'aether-core:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@e9d90e5f6e9f1e260c9cdeb2e29d4dbe11b8e3b3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test container
        run: |
          TAG=$(echo "${{ needs.build.outputs.tags }}" | head -n1)
          echo "Testing image: $TAG"

          docker pull "$TAG"

          docker run -d --name aether-test \
            -p 8080:8080 \
            "$TAG"

          echo "Waiting for container to start..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Health check failed after 12 attempts"
              docker logs aether-test
              exit 1
            fi
            sleep 5
          done

          docker stop aether-test
          docker rm aether-test

  summary:
    name: Container Summary
    needs: [build, scan, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.scan.result == 'success' && '[PASS]' || '[WARN]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Test | ${{ needs.test.result == 'success' && '[PASS]' || '[FAIL]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
