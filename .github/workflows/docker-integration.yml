name: Docker Integration Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FDB_VERSION: "7.3.27"
  FDB_IMAGE: foundationdb/foundationdb:7.3.27

jobs:
  docker-integration:
    name: FDB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-03-01
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fdb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fdb-
            ${{ runner.os }}-cargo-

      - name: Start FDB container
        run: |
          # Install FDB client library (needed by foundationdb-sys crate for linking)
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb-client.deb
          sudo dpkg -i /tmp/fdb-client.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

          docker network create aether-net
          docker run -d \
            --name fdb \
            --network aether-net \
            -p 4500:4500 \
            ${{ env.FDB_IMAGE }}

      - name: Wait for FDB healthy
        run: |
          # A fresh FDB cluster has NO database: "The database is
          # available" is unreachable until `configure new` runs. Poll
          # status and attempt configuration until it sticks.
          echo "Waiting for FoundationDB to become healthy..."
          for i in $(seq 1 60); do
            if docker exec fdb fdbcli --exec "status minimal" 2>/dev/null | grep -q "The database is available"; then
              echo "FoundationDB is healthy after ${i} attempts"
              exit 0
            fi
            docker exec fdb fdbcli --exec "configure new single memory" 2>/dev/null || true
            echo "Attempt ${i}/60 - FDB not ready yet..."
            sleep 3
          done
          echo "FoundationDB failed to become healthy"
          docker logs fdb
          exit 1

      - name: Extract FDB cluster file
        run: |
          # In FDB_NETWORKING_MODE=host the entrypoint may place the
          # cluster file outside /etc/foundationdb (it also wants FDB_IP
          # set; without it the location is not guaranteed). Locate it
          # from the running fdbserver's own cmdline, then copy it out.
          CLUSTER_PATH=$(docker exec fdb sh -c \
            'tr "\0" "\n" < /proc/1/cmdline | grep -A1 -- -C | tail -1' 2>/dev/null || true)
          if [ -z "$CLUSTER_PATH" ]; then
            CLUSTER_PATH=$(docker exec fdb sh -c \
              'ls /etc/foundationdb/fdb.cluster /var/fdb/fdb.cluster 2>/dev/null | head -1')
          fi
          echo "cluster file in container: $CLUSTER_PATH"
          # Rewrite the coordinator IP to the published-port address,
          # PRESERVING name:desc (the server's identity): the server is
          # reached through -p 4500:4500 from the runner.
          docker exec fdb cat "$CLUSTER_PATH" \
            | sed -E 's/@[0-9.]+:/@127.0.0.1:/g' \
            | sudo tee /etc/foundationdb/fdb.cluster
          echo "FDB_CLUSTER_FILE=/etc/foundationdb/fdb.cluster" >> "$GITHUB_ENV"

      - name: Build with fdb feature
        run: cargo build --features fdb

      - name: Run integration tests (fdb)
        run: cargo test --package aether-core --features fdb -- --nocapture fdb_integration_tests

      - name: Run actor migration tests (fdb)
        run: cargo test --features fdb migration -- --nocapture

      - name: Run state manager FDB tests
        run: cargo test --features fdb state -- --nocapture

      - name: Stop FDB container
        if: always()
        run: |
          docker stop fdb || true
          docker rm fdb || true
          docker network rm aether-net || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fdb-integration-results
          path: target/test-results/

  # NOTE: the former docker-cluster (3-node compose mesh) job is removed:
  # it exercised an imagined CLI contract ("aether run --node-id
  # --http-port --mesh-port --mesh-seeds") — the real binary is
  # aether-cli (run --port/--host only, spawning aether-server), and the
  # Dockerfile never shipped aether-server at all. A real 3-node mesh
  # compose demo needs product work first: node identity + mesh seed
  # flags on the CLI (tracked in the SIS engineering loop backlog).
