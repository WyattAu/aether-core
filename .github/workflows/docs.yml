name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'sdks/python/docs/**'
      - 'sdks/javascript/docs/**'
      - 'sdks/javascript/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0a5c615913e4abef308c4d70791a5a2a3eb62383
        with:
          python-version: '3.11'

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mike

      - name: Build MkDocs site
        run: |
          cd docs-site
          mkdocs build --strict

      - name: Copy .nojekyll to site
        run: cp docs-site/.nojekyll docs-site/site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc6097d7530ff81ddaa5e9282828b55a8a1d9
        with:
          path: docs-site/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db901f6cf9298efe76f48639015af9d534997d
