name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'sdks/python/docs/**'
      - 'sdks/javascript/docs/**'
      - 'sdks/javascript/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c591e6cc1a578853edd1d6c9435e2
        with:
          python-version: '3.11'

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mike

      - name: Build MkDocs site
        run: |
          cd docs-site
          mkdocs build --strict

      - name: Copy .nojekyll to site
        run: cp docs-site/.nojekyll docs-site/site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc6097d775178f52524783378180af0d1f8
        with:
          path: docs-site/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@1f7e34d2a9c03e4aa291a14df5e6e792c0a23673
