name: Documentation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-03-01
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build documentation
        run: |
          cargo doc --workspace --all-features --no-deps --document-private-items
      
      - name: Add redirect
        run: |
          echo '<meta http-equiv="refresh" content="0;url=aether_core/index.html">' > target/doc/index.html
      
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc

  mkdocs:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install MkDocs
        run: |
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin
      
      - name: Build MkDocs site
        run: |
          cd docs-site
          mkdocs build --strict
      
      - name: Upload MkDocs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: docs-site/site

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress '**/*.md' '**/*.rs'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-reference:
    name: Generate API Reference
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-03-01
      
      - name: Install cargo-rdme
        run: cargo install cargo-rdme
      
      - name: Generate API reference
        run: |
          cargo rdme --workspace
      
      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: README.md

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, mkdocs, link-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Rust documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: doc/api
      
      - name: Download MkDocs site
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-site
          path: doc
      
      - name: Merge documentation
        run: |
          # Move MkDocs site to root
          mv doc/site/* doc/ 2>/dev/null || true
          # Move Rust API docs to api subdirectory
          mkdir -p doc/api
          mv doc/api/* doc/api/ 2>/dev/null || true
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docs-summary:
    name: Documentation Summary
    needs: [build, mkdocs, link-check, api-reference]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check documentation job results
        run: |
          echo "## Documentation Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Rust Docs | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build MkDocs Site | ${{ needs.mkdocs.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link Check | ${{ needs.link-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Reference | ${{ needs.api-reference.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📚 Documentation deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          fi
