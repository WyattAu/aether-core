name: GitOps Deploy

concurrency:
  group: gitops-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['deploy/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      version:
        description: 'Version to deploy'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Deploy with Helm
        run: |
          helm upgrade --install aether deploy/helm/aether/ \
            --namespace aether --create-namespace \
            --set image.repository=${{ env.REGISTRY || 'ghcr.io/wyattau/aether-core' }} \
            --set image.tag=${{ github.event.inputs.version || 'latest' }} \
            --wait --timeout 5m
