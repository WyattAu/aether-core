name: Integration Tests

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [nightly-2026-03-01, stable]
        exclude:
          - os: macos-latest
            rust: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@923806f6a5b9ac6d707a178f02738743342a1789

      - name: Install FoundationDB client (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/7.3.27/foundationdb-clients_7.3.27-1_amd64.deb -o /tmp/fdb-client.deb
          sudo dpkg -i /tmp/fdb-client.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Run all tests (Linux -- all features)
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features

      - name: Run all tests (macOS -- exclude FDB)
        if: runner.os == 'macOS'
        run: cargo test --workspace --features "wasm mesh rkyv"

      - name: Run doc tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc --all-features

      - name: Run doc tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --doc --features "wasm mesh rkyv"

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@923806f6a5b9ac6d707a178f02738743342a1789

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/7.3.27/foundationdb-clients_7.3.27-1_amd64.deb -o /tmp/fdb-client.deb
          sudo dpkg -i /tmp/fdb-client.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release

      - name: Build WASM examples
        run: |
          for example in examples/*/; do
            if [ -f "$example/Cargo.toml" ]; then
              cargo build --release --target wasm32-wasip1 --manifest-path "$example/Cargo.toml"
            fi
          done

      - name: Run E2E tests
        run: cargo test -p aether-tests --test wasm_e2e_test --features wasm

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        with:
          name: e2e-logs
          path: |
            logs/
            *.log

  chaos:
    name: Chaos Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01

      - uses: Swatinem/rust-cache@923806f6a5b9ac6d707a178f02738743342a1789

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/7.3.27/foundationdb-clients_7.3.27-1_amd64.deb -o /tmp/fdb-client.deb
          sudo dpkg -i /tmp/fdb-client.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release

      - name: Install chaos tools
        run: |
          sudo apt-get update
          sudo apt-get install -y stress-ng

      - name: Run chaos tests
        run: |
          echo "## Chaos Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          cargo test -p aether-tests --features chaos -- --nocapture 2>&1 | tee chaos-output.txt
          CHAOS_EXIT=$?

          if [ -f chaos-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 chaos-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          exit $CHAOS_EXIT

      - name: Upload chaos results
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        if: always()
        with:
          name: chaos-results
          path: chaos-output.txt

  stress:
    name: Stress Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01

      - uses: Swatinem/rust-cache@923806f6a5b9ac6d707a178f02738743342a1789

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/7.3.27/foundationdb-clients_7.3.27-1_amd64.deb -o /tmp/fdb-client.deb
          sudo dpkg -i /tmp/fdb-client.deb || true
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release

      - name: Run stress tests
        run: |
          cargo test -p aether-tests --features chaos --release -- --nocapture --test-threads=1 2>&1 | tee stress-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload stress results
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        if: always()
        with:
          name: stress-results
          path: stress-output.txt

  integration-summary:
    name: Integration Test Summary
    needs: [test, e2e, chaos, stress]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & Integration Tests | ${{ needs.test.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| End-to-End Tests | ${{ needs.e2e.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Chaos Tests | ${{ needs.chaos.result == 'success' && 'PASS' || (needs.chaos.result == 'skipped' && 'SKIP' || 'FAIL') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stress Tests | ${{ needs.stress.result == 'success' && 'PASS' || (needs.stress.result == 'skipped' && 'SKIP' || 'FAIL') }} |" >> $GITHUB_STEP_SUMMARY
