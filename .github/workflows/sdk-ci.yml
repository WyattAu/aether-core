name: SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-ci.yml'
  schedule:
    # Nightly build at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: sdks/go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go fmt
        run: go fmt ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run static analysis
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2023.1.7"
          install-go: false
          working-directory: sdks/go

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdks/go/coverage.out
          flags: go-sdk
          fail_ci_if_error: false

      - name: Build examples
        run: |
          for dir in examples/*/; do
            echo "Building $dir"
            go build -v ./$dir
          done

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sdks/python/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run linting
        run: |
          ruff check aether_sdk/ tests/ examples/
          black --check aether_sdk/ tests/ examples/
          isort --check-only aether_sdk/ tests/ examples/

      - name: Run type checking
        run: mypy aether_sdk/
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=aether_sdk --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdks/python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: false

  javascript-sdk:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdks/js/coverage/lcov.info
          flags: javascript-sdk
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  sdk-compatibility:
    name: SDK Compatibility
    runs-on: ubuntu-latest
    needs: [go-sdk, python-sdk, javascript-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cross-SDK tests
        run: |
          echo "Cross-SDK compatibility tests would run here"
          echo "This ensures all SDKs can communicate with each other"
          echo "and with the Rust runtime"
