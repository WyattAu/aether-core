name: SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-ci.yml'
  schedule:
    # Nightly build at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: sdks/go/go.sum

      - name: Run tests
        run: go test ./... -v -count=1

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sdks/python/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort
          pip install -e .

      - name: Run linting
        run: |
          ruff check aether_sdk/ tests/ examples/
          black --check aether_sdk/ tests/ examples/
          isort --check-only --profile black aether_sdk/ tests/ examples/

      - name: Run type checking
        run: mypy aether_sdk/
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=aether_sdk --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdks/python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: false

  javascript-sdk:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm exec jest --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdks/javascript/coverage/lcov.info
          flags: javascript-sdk
          fail_ci_if_error: false

      - name: Build
        run: pnpm run build

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: sdks/java/**/pom.xml

      - name: Run tests
        run: mvn test

  sdk-compatibility:
    name: SDK Compatibility
    runs-on: ubuntu-latest
    needs: [go-sdk, python-sdk, javascript-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cross-SDK tests
        run: |
          echo "Cross-SDK compatibility tests would run here"
          echo "This ensures all SDKs can communicate with each other"
          echo "and with the Rust runtime"
