name: SDK Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to publish'
        required: true
        type: choice
        options:
          - all
          - javascript
          - python
          - go
      version:
        description: 'Version bump type (for manual dispatch)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-javascript:
    name: Publish JavaScript SDK to npm
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || inputs.sdk == 'all' || inputs.sdk == 'javascript' }}
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build TypeScript
        run: pnpm run build
      
      - name: Run tests
        run: pnpm test
      
      - name: Publish to npm
        run: |
          pnpm version --no-git-tag-version ${GITHUB_REF#refs/tags/}
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish Summary
        run: |
          echo "## JavaScript SDK Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package: @aether/sdk@${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "Registry: https://registry.npmjs.org" >> $GITHUB_STEP_SUMMARY

  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || inputs.sdk == 'all' || inputs.sdk == 'python' }}
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      
      - name: Publish Summary
        run: |
          echo "## Python SDK Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package: aether-sdk" >> $GITHUB_STEP_SUMMARY
          echo "Registry: https://pypi.org/project/aether-sdk/" >> $GITHUB_STEP_SUMMARY

  verify-go:
    name: Verify Go SDK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || inputs.sdk == 'all' || inputs.sdk == 'go' }}
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Verify module
        run: |
          go mod verify
          go build ./...
          go test ./...
      
      - name: Publish Summary
        run: |
          echo "## Go SDK Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Module: github.com/WyattAu/aether-core/sdks/go" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "go get github.com/WyattAu/aether-core/sdks/go@${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  publish-summary:
    name: SDK Publish Summary
    needs: [publish-javascript, publish-python, verify-go]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# SDK Publishing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| SDK | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript (npm) | ${{ needs.publish-javascript.result == 'success' && '✅ Published' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python (PyPI) | ${{ needs.publish-python.result == 'success' && '✅ Published' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go (modules) | ${{ needs.verify-go.result == 'success' && '✅ Verified' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### JavaScript" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @aether/sdk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install aether-sdk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Go" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "go get github.com/WyattAu/aether-core/sdks/go" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
