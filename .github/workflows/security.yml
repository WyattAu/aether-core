name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  FDB_VERSION: "7.3.27"

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Run security audit
        run: cargo audit --json > audit-results.json 2>&1 || true
      
      - name: Generate SARIF output
        run: |
          cat > audit.sarif <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "cargo-audit",
                  "informationUri": "https://github.com/RustSec/cargo-audit"
                }
              },
              "results": []
            }]
          }
          EOF
          
          if [ -f audit-results.json ]; then
            python3 <<'PYTHON'
          import json
          import sys
          
          try:
              with open('audit-results.json', 'r') as f:
                  data = json.load(f)
              
              sarif = {
                  "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
                  "version": "2.1.0",
                  "runs": [{
                      "tool": {
                          "driver": {
                              "name": "cargo-audit",
                              "informationUri": "https://github.com/RustSec/cargo-audit"
                          }
                      },
                      "results": []
                  }]
              }
              
              vulnerabilities = data.get('vulnerabilities', {}).get('list', [])
              for vuln in vulnerabilities:
                  result = {
                      "ruleId": vuln.get('advisory', {}).get('id', 'unknown'),
                      "message": {
                          "text": f"{vuln.get('advisory', {}).get('title', 'Unknown vulnerability')}: {vuln.get('advisory', {}).get('description', '')}"
                      },
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": f"Cargo.lock"
                              }
                          }
                      }]
                  }
                  sarif["runs"][0]["results"].append(result)
              
              with open('audit.sarif', 'w') as f:
                  json.dump(sarif, f, indent=2)
          except Exception as e:
              print(f"Error processing audit results: {e}", file=sys.stderr)
          PYTHON
          fi
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@382eb82952427676a27a9c07b9e80514daa2d83c
        with:
          sarif_file: audit.sarif
          category: cargo-audit
      
      - name: Check for critical/high vulnerabilities
        run: |
          if [ -f audit-results.json ]; then
            CRITICAL=$(python3 -c "import json; d=json.load(open('audit-results.json')); vulns=d.get('vulnerabilities',{}).get('list',[]); print(sum(1 for v in vulns if v.get('advisory',{}).get('severity','') in ('Critical','High')))" 2>/dev/null || echo 0)
            if [ "$CRITICAL" -gt 0 ]; then
              echo "Found $CRITICAL critical/high severity vulnerabilities"
              cat audit-results.json
              exit 1
            fi
          fi
      
      - name: Upload audit results
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        if: always()
        with:
          name: security-audit
          path: |
            audit-results.json
            audit.sarif

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Dependency Review
        uses: actions/dependency-review-action@91221dab0253ba3b2331b6e9db7f6058be18a8e6
        with:
          fail-on-severity: high
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, Unicode-DFS-2016, Zlib

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@382eb82952427676a27a9c07b9e80514daa2d83c
        with:
          languages: rust
          queries: security-and-quality
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01

      - name: Install FoundationDB client
        run: |
          curl -sSL https://github.com/apple/foundationdb/releases/download/${{ env.FDB_VERSION }}/foundationdb-clients_${{ env.FDB_VERSION }}-1_amd64.deb -o /tmp/fdb.deb
          sudo dpkg -i /tmp/fdb.deb || true
          sudo ldconfig
          # Verify libfdb_c is findable by the linker
          ldconfig -p | grep libfdb_c || echo "WARNING: libfdb_c not found in linker cache"
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "FDB_CLIENT_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Build
        run: cargo build --workspace --all-features
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@382eb82952427676a27a9c07b9e80514daa2d83c
        with:
          category: rust-security

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e7752d4e6638922a58cc2e0c65f45155ea86cfb8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01
      
      - name: Install cargo-license
        run: cargo install cargo-license --locked
      
      - name: Check licenses
        run: |
          cargo license --avoid-dev-deps --avoid-build-deps --filter-platform x86_64-unknown-linux-gnu > licenses.txt
          cat licenses.txt
          
          echo "Checking for forbidden licenses (GPL-only, AGPL, SSPL, BSL-only)..."
          # Exclude dual-licensed crates that offer a permissive option (Apache-2.0 OR GPL, etc.)
          # Flag only crates with copyleft-only or restrictive licenses
          grep -v " OR " licenses.txt | grep -iE "GPL|AGPL|LGPL|SSPL|BSL" && {
            echo "Error: Found copyleft-only or restrictive licenses"
            exit 1
          }
          echo "License check passed!"
      
      - name: Upload license report
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        with:
          name: license-report
          path: licenses.txt

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@148c24f4344b6c4e29093d3e8b84be6a28897f5b
        with:
          toolchain: nightly-2026-03-01

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@517a82f3e0c4e2e167f3be615b76fb3070a5df57
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f59865d7d3a283a5ee3f81ae
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  security-summary:
    name: Security Summary
    needs: [audit, codeql, secrets-scan, license-check, sbom]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check security job results
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.audit.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
