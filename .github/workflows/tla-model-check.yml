name: TLA+ Model Checking

on:
  push:
    branches: [main, develop]
    paths:
      - '.specs/02_architecture/proofs/**'
  pull_request:
    paths:
      - '.specs/02_architecture/proofs/**'

permissions:
  contents: read

jobs:
  model-check:
    name: TLC ${{ matrix.spec.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - name: scheduler
            tla: scheduler.tla
            cfg: SchedulerCfg.cfg
          - name: gossip
            tla: gossip.tla
            cfg: GossipCfg.cfg
          - name: migration_two_phase
            tla: migration_two_phase.tla
            cfg: MigrationCfg.cfg
          - name: scheduler_work_stealing
            tla: scheduler_work_stealing.tla
            cfg: WorkStealingCfg.cfg
          - name: leader_election
            tla: tla_leader_election.tla
            cfg: tla_leader_election.cfg
    container:
      image: ghcr.io/tlaplus/tlaplus:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run TLC — ${{ matrix.spec.name }}
        working-directory: .specs/02_architecture/proofs
        run: |
          tlc2.TLC \
            -workers auto \
            -cleanup \
            -depth 100 \
            "${{ matrix.spec.tla }}" \
            -config "${{ matrix.spec.cfg }}"

      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@654c28fbec712ddbf170266f20aa82b4a8e84e26
        with:
          name: tlc-${{ matrix.spec.name }}
          path: .specs/02_architecture/proofs/${{ matrix.spec.tla }}.*
          retention-days: 30
