name: TLA+ Model Checking

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - '.specs/02_architecture/proofs/**'
  pull_request:
    paths:
      - '.specs/02_architecture/proofs/**'

permissions:
  contents: read

jobs:
  model-check:
    name: TLC ${{ matrix.spec.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - name: scheduler
            tla: scheduler.tla
            cfg: SchedulerCfg.cfg
          - name: gossip
            tla: gossip.tla
            cfg: GossipCfg.cfg
          - name: migration_two_phase
            tla: migration_two_phase.tla
            cfg: MigrationCfg.cfg
          - name: scheduler_work_stealing
            tla: scheduler_work_stealing.tla
            cfg: WorkStealingCfg.cfg
          - name: leader_election
            tla: tla_leader_election.tla
            cfg: tla_leader_election.cfg
    container:
      image: ghcr.io/tlaplus/tlaplus:1.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run TLC — ${{ matrix.spec.name }}
        working-directory: .specs/02_architecture/proofs
        run: |
          tlc2.TLC \
            -workers auto \
            -cleanup \
            -depth 100 \
            "${{ matrix.spec.tla }}" \
            -config "${{ matrix.spec.cfg }}"

      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tlc-${{ matrix.spec.name }}
          path: .specs/02_architecture/proofs/${{ matrix.spec.tla }}.*
          retention-days: 30
