fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "develop"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-features
        language: system
        types: [rust]
        pass_filenames: false
        verbose: true

      - id: no-stubs
        name: no stubs or todo markers
        entry: >
          bash -c '
          find crates/ -type f -name "*.rs" ! -name "*test*" ! -name "*fixture*" \
            ! -path "*/tests/*" ! -path "*/test/*" \
            -exec grep -Hn -E "(todo!\(\)|unimplemented!\(\)|FIXME|HACK|XXX)" {} + \
            && exit 1 || exit 0
          '
        language: system
        types: [rust]
        pass_filenames: false

      - id: check-rust-version
        name: check rust-toolchain.toml
        entry: test -f rust-toolchain.toml
        language: system
        pass_filenames: false
        always_run: true
