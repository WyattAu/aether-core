# =============================================================================
# Error Budgets
# =============================================================================

[[error_budgets]]
id = "EB-SER-001"
name = "hydration_errors"
description = "Acceptable error rates for hydration"

[error_budgets.specification]
checksum_mismatch_rate = "1e-9"  # Corrupted archives
validation_failure_rate = "1e-9"  # Invalid structure
timeout_rate = "1e-6"  # Exceeding time budget
allocation_failure_rate = "1e-8"  # OOM during hydration

[[error_budgets]]
id = "EB-SER-002"
name = "checkpoint_errors"
description = "Acceptable error rates for checkpointing"

[error_budgets.specification]
fdb_conflict_rate = "1e-4"  # Concurrent checkpoints
fdb_timeout_rate = "1e-6"  # FDB unavailable
serialization_failure_rate = "0"  # Must never fail

