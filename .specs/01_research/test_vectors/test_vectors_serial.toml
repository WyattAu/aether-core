    { offset = 0, field = "a", size = 1 },
    { offset = 1, field = "padding", size = 3 },
    { offset = 4, field = "b", size = 4 },
    { offset = 8, field = "c", size = 2 },
    { offset = 10, field = "padding", size = 2 }
]

[[test_vectors]]
id = "TV-SER-011"
category = "compound_types"
name = "nested_struct"
description = "Struct containing another struct"

[test_vectors.input]
type = "NestedStruct"
value = { 
    inner = { ptr = 0x1000, len = 100, cap = 200 },
    flag = true,
    count = 999
}

[test_vectors.expected]
archive_size = 32  # 16 + 1 + 7 padding + 8
alignment = 8
field_offsets = { inner = 0, flag = 16, count = 24 }

