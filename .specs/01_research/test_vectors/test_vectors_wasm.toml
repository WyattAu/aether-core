# =============================================================================
# Test Execution Configuration
# =============================================================================

[execution]
parallel_groups = 4
timeout_per_test_ms = 5000
retries = 3
fail_fast = false

[reporting]
output_format = "junit"
output_path = "test-results/wasm-runtime.xml"
coverage_enabled = true

[validation]
strict_mode = true
verify_invariants = true
verify_axioms = true
