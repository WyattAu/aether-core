# Interface Contracts for QUIC Mesh Network (BP-MESH-NETWORK-001)
# IEEE 1016-2009 Compliant Interface Specifications

version = "1.0.0"
document_id = "BP-MESH-NETWORK-001"
standard = "IEEE-1016-2009"
created = "2026-03-05"
last_modified = "2026-03-05"

# ============================================================================
# IF-MESH-001: Send Message
# ============================================================================

[interfaces.IF-MESH-001]
name = "Send Message"
id = "IF-MESH-001"
provider = "COMP-MESH-001"
consumer = ["Actor Runtime"]
protocol = "Internal API"
purpose = "Send a message from one actor to another through the mesh"

[interfaces.IF-MESH-001.signature]
language = "rust"
definition = """
fn send_message(
    from_actor: ActorID,
    to_actor: ActorID,
    message: &[u8],
    options: SendOptions
) -> Result<SendReceipt, MeshError>
"""

[interfaces.IF-MESH-001.parameters]
from_actor = { type = "ActorID", description = "Source actor identifier (SHA-256 hash)", size = "32 bytes" }
to_actor = { type = "ActorID", description = "Target actor identifier (SHA-256 hash)", size = "32 bytes" }
message = { type = "&[u8]", description = "Message payload", max_size = "65535 bytes" }

[interfaces.IF-MESH-001.parameters.options]
type = "SendOptions"
description = "Delivery options"
fields = [
    { name = "timeout", type = "Duration", default = "30s", description = "Maximum delivery time" },
    { name = "priority", type = "Priority", default = "Normal", values = ["Low", "Normal", "High"] },
    { name = "retry_count", type = "u32", default = "3", description = "Number of retry attempts" },
    { name = "require_ack", type = "bool", default = "true", description = "Require delivery acknowledgment" }
]

[interfaces.IF-MESH-001.returns]
type = "Result<SendReceipt, MeshError>"

[interfaces.IF-MESH-001.returns.success]
type = "SendReceipt"
fields = [
    { name = "message_id", type = "UUID", description = "Unique message identifier" },
    { name = "timestamp", type = "Instant", description = "Send timestamp" },
    { name = "estimated_delivery", type = "Duration", description = "Estimated delivery time" }
]

[interfaces.IF-MESH-001.returns.errors]
types = [
    { name = "ActorNotFound", description = "Target actor not resolvable", recoverable = false },
    { name = "Backpressure", description = "Flow control blocked, retry later", recoverable = true },
    { name = "ConnectionFailed", description = "Network failure", recoverable = true },
    { name = "Timeout", description = "Delivery timeout exceeded", recoverable = true },
    { name = "MessageTooLarge", description = "Message exceeds maximum size", recoverable = false }
]

[interfaces.IF-MESH-001.preconditions]
items = [
    "from_actor is locally registered",
    "message.len() <= 65535 bytes",
    "Flow control credit available OR options.allow_backpressure = true",
    "Connection pool has capacity OR existing connection to target node"
]

[interfaces.IF-MESH-001.postconditions]
on_success = [
    "Message queued in outgoing buffer",
    "SendReceipt returned with valid message_id",
    "Credit deducted from flow control window",
    "Message marked as in-flight"
]
on_error = [
    "No state change to connection pool",
    "No credit deducted",
    "Error returned to caller with recovery hint"
]

[interfaces.IF-MESH-001.behavior]
idempotent = false
blocking = true
timeout = "configurable (default 30s)"
concurrency = "thread-safe"

[interfaces.IF-MESH-001.performance]
expected_latency_p50 = "1ms"
expected_latency_p99 = "10ms"
max_throughput = "100k msg/s per node"

# ============================================================================
# IF-MESH-002: Receive Message
# ============================================================================

[interfaces.IF-MESH-002]
name = "Receive Message"
id = "IF-MESH-002"
provider = "COMP-MESH-001"
consumer = ["Actor Runtime"]
protocol = "Internal API"
purpose = "Receive incoming messages for local actors"

[interfaces.IF-MESH-002.signature]
language = "rust"
definition = """
fn receive_message(
    actor: ActorID,
    timeout: Duration
) -> Result<Message, MeshError>
"""

[interfaces.IF-MESH-002.parameters]
actor = { type = "ActorID", description = "Target actor identifier", size = "32 bytes" }
timeout = { type = "Duration", description = "Maximum wait time", default = "100ms" }

[interfaces.IF-MESH-002.returns]
type = "Result<Message, MeshError>"

[interfaces.IF-MESH-002.returns.success]
type = "Message"
fields = [
    { name = "from_actor", type = "ActorID", description = "Source actor identifier" },
    { name = "to_actor", type = "ActorID", description = "Target actor identifier (should match parameter)" },
    { name = "payload", type = "Vec<u8>", description = "Message payload" },
    { name = "message_id", type = "UUID", description = "Unique message identifier" },
    { name = "timestamp", type = "Instant", description = "Receive timestamp" },
    { name = "hop_count", type = "u8", description = "Number of mesh hops traversed" }
]

[interfaces.IF-MESH-002.returns.errors]
types = [
    { name = "Timeout", description = "No message within timeout", recoverable = true },
    { name = "ActorNotFound", description = "Actor not registered", recoverable = false },
    { name = "MailboxFull", description = "Actor mailbox capacity exceeded", recoverable = true }
]

[interfaces.IF-MESH-002.preconditions]
items = [
    "actor is locally registered",
    "Actor mailbox not full (capacity: 1000 messages)"
]

[interfaces.IF-MESH-002.postconditions]
on_success = [
    "Message removed from actor mailbox",
    "Credit released to flow controller",
    "Acknowledgment queued for sender"
]
on_error = [
    "No state change to mailbox",
    "No acknowledgment sent"
]

[interfaces.IF-MESH-002.behavior]
idempotent = false
blocking = true
timeout = "configurable"
concurrency = "thread-safe, multiple consumers per actor allowed"

[interfaces.IF-MESH-002.performance]
expected_latency_p50 = "0.1ms"
expected_latency_p99 = "1ms"

# ============================================================================
# IF-MESH-003: Resolve Actor
# ============================================================================

[interfaces.IF-MESH-003]
name = "Resolve Actor"
id = "IF-MESH-003"
provider = "COMP-MESH-002"
consumer = ["COMP-MESH-001", "Actor Runtime"]
protocol = "Internal API"
purpose = "Resolve actor identifier to reachable node addresses"

[interfaces.IF-MESH-003.signature]
language = "rust"
definition = """
fn resolve_actor(
    actor_id: ActorID,
    timeout: Duration
) -> Result<Set<NodeID>, MeshError>
"""

[interfaces.IF-MESH-003.parameters]
actor_id = { type = "ActorID", description = "Actor identifier to resolve", size = "32 bytes" }
timeout = { type = "Duration", description = "Maximum resolution time", default = "5s" }

[interfaces.IF-MESH-003.returns]
type = "Result<Set<NodeID>, MeshError>"

[interfaces.IF-MESH-003.returns.success]
type = "Set<NodeID>"
description = "Set of nodes hosting the actor (may be empty if actor not found)"
element_type = "NodeID"
element_size = "32 bytes (Ed25519 public key)"
typical_size = "1-3 nodes"

[interfaces.IF-MESH-003.returns.errors]
types = [
    { name = "NotFound", description = "Actor not found in mesh", recoverable = false },
    { name = "Timeout", description = "Resolution timed out", recoverable = true },
    { name = "DHTUnavailable", description = "DHT cluster unreachable", recoverable = true }
]

[interfaces.IF-MESH-003.preconditions]
items = [
    "DHT client is healthy OR local cache has entry"
]

[interfaces.IF-MESH-003.postconditions]
on_success = [
    "Result cached locally (TTL: 60s)",
    "Cache size bounded (max 10,000 entries)",
    "LRU eviction if cache full"
]
on_error = [
    "Stale cache entry may still exist",
    "Error logged for monitoring"
]

[interfaces.IF-MESH-003.behavior]
idempotent = true
blocking = true
timeout = "configurable (default 5s)"
concurrency = "thread-safe"

[interfaces.IF-MESH-003.performance]
cache_hit_latency = "0.01ms"
cache_miss_latency_p50 = "50ms"
cache_miss_latency_p99 = "200ms"
cache_hit_rate = "90%"

[interfaces.IF-MESH-003.caching]
enabled = true
max_size = 10000
ttl = "60s"
eviction_policy = "LRU"

# ============================================================================
# IF-MESH-004: TCP Proxy
# ============================================================================

[interfaces.IF-MESH-004]
name = "TCP Proxy"
id = "IF-MESH-004"
provider = "COMP-MESH-003"
consumer = ["External TCP Clients"]
protocol = "TCP"
purpose = "Accept TCP connection and proxy to QUIC mesh"

[interfaces.IF-MESH-004.signature]
language = "rust"
definition = """
fn proxy_tcp_connection(
    tcp_stream: TcpStream,
    target_actor: ActorID,
    config: ProxyConfig
) -> Result<(), ProxyError>
"""

[interfaces.IF-MESH-004.parameters]
tcp_stream = { type = "TcpStream", description = "Accepted TCP connection" }
target_actor = { type = "ActorID", description = "Target actor for all traffic", size = "32 bytes" }

[interfaces.IF-MESH-004.parameters.config]
type = "ProxyConfig"
description = "Proxy configuration"
fields = [
    { name = "read_buffer_size", type = "usize", default = "65536", description = "TCP read buffer size" },
    { name = "write_buffer_size", type = "usize", default = "65536", description = "TCP write buffer size" },
    { name = "idle_timeout", type = "Duration", default = "300s", description = "Connection idle timeout" },
    { name = "max_message_size", type = "usize", default = "65535", description = "Maximum message size" }
]

[interfaces.IF-MESH-004.returns]
type = "Result<(), ProxyError>"

[interfaces.IF-MESH-004.returns.success]
type = "()"
description = "Proxying completed (connection closed normally)"

[interfaces.IF-MESH-004.returns.errors]
types = [
    { name = "TargetNotResolvable", description = "Target actor not resolvable", recoverable = false },
    { name = "ConnectionFailed", description = "QUIC connection failed", recoverable = true },
    { name = "ProtocolError", description = "Protocol conversion error", recoverable = false },
    { name = "Timeout", description = "Idle timeout exceeded", recoverable = false }
]

[interfaces.IF-MESH-004.preconditions]
items = [
    "tcp_stream is connected",
    "target_actor is resolvable OR cached"
]

[interfaces.IF-MESH-004.postconditions]
on_success = [
    "All TCP data forwarded to QUIC stream",
    "All QUIC data forwarded to TCP stream",
    "Both connections closed gracefully"
]
on_error = [
    "TCP connection closed with error",
    "QUIC stream closed (if opened)",
    "Error logged with client IP (anonymized)"
]

[interfaces.IF-MESH-004.behavior]
idempotent = false
blocking = true
timeout = "idle_timeout (default 300s)"
concurrency = "one proxy task per TCP connection"

[interfaces.IF-MESH-004.performance]
overhead_latency = "1-2ms (single hop proxy)"
throughput = "limited by TCP client"
concurrent_connections = "1000 per proxy instance"

# ============================================================================
# IF-MESH-005: Connection Pool
# ============================================================================

[interfaces.IF-MESH-005]
name = "Connection Pool"
id = "IF-MESH-005"
provider = "COMP-MESH-001"
consumer = ["COMP-MESH-003", "COMP-MESH-004"]
protocol = "Internal API"
purpose = "Acquire and manage QUIC connections from pool"

[interfaces.IF-MESH-005.signature]
language = "rust"
definition = """
fn acquire_connection(
    node_id: NodeID
) -> Result<Connection, PoolError>
"""

[interfaces.IF-MESH-005.parameters]
node_id = { type = "NodeID", description = "Target node identifier", size = "32 bytes" }

[interfaces.IF-MESH-005.returns]
type = "Result<Connection, PoolError>"

[interfaces.IF-MESH-005.returns.success]
type = "Connection"
description = "QUIC connection to target node"
properties = [
    "Connection is healthy",
    "Connection has available stream capacity",
    "Connection last_used timestamp updated"
]

[interfaces.IF-MESH-005.returns.errors]
types = [
    { name = "PoolExhausted", description = "Pool at max capacity and no evictable connections", recoverable = true },
    { name = "ConnectionFailed", description = "Failed to establish new connection", recoverable = true },
    { name = "NodeUnreachable", description = "Target node not reachable", recoverable = true }
]

[interfaces.IF-MESH-005.preconditions]
items = [
    "node_id is valid Ed25519 public key",
    "Pool not shutdown"
]

[interfaces.IF-MESH-005.postconditions]
on_success = [
    "Connection added to pool if new",
    "Connection moved to front of LRU list",
    "Pool size <= max_size (100)"
]
on_error = [
    "No change to pool state",
    "Error logged with node_id"
]

[interfaces.IF-MESH-005.behavior]
idempotent = false
blocking = true
timeout = "connection establishment (100-300ms)"
concurrency = "thread-safe"

[interfaces.IF-MESH-005.performance]
cache_hit_latency = "0.1ms"
cache_miss_latency_p50 = "100ms"
cache_miss_latency_p99 = "300ms"
eviction_latency = "1ms"

[interfaces.IF-MESH-005.pool_config]
max_size = 100
eviction_policy = "LRU"
health_check_interval = "30s"
idle_timeout = "60s"

# ============================================================================
# IF-MESH-006: Flow Control
# ============================================================================

[interfaces.IF-MESH-006]
name = "Flow Control"
id = "IF-MESH-006"
provider = "COMP-MESH-004"
consumer = ["COMP-MESH-001"]
protocol = "Internal API"
purpose = "Manage credit-based flow control"

[interfaces.IF-MESH-006.signature]
language = "rust"
definition = """
fn acquire_credit(
    bytes: usize
) -> Result<CreditReceipt, FlowControlError>
"""

[interfaces.IF-MESH-006.parameters]
bytes = { type = "usize", description = "Number of bytes to send", max = "65535" }

[interfaces.IF-MESH-006.returns]
type = "Result<CreditReceipt, FlowControlError>"

[interfaces.IF-MESH-006.returns.success]
type = "CreditReceipt"
description = "Credit granted for sending"
fields = [
    { name = "bytes", type = "usize", description = "Bytes granted" },
    { name = "remaining_credit", type = "usize", description = "Remaining available credit" }
]

[interfaces.IF-MESH-006.returns.errors]
types = [
    { name = "InsufficientCredit", description = "Not enough credit available", recoverable = true },
    { name = "BackpressureActive", description = "Backpressure signal active, retry later", recoverable = true }
]

[interfaces.IF-MESH-006.preconditions]
items = [
    "bytes <= 65535",
    "bytes <= window_size (1MB)"
]

[interfaces.IF-MESH-006.postconditions]
on_success = [
    "Credit deducted from available_credit",
    "CreditReceipt issued",
    "If buffer_occupancy > threshold_high, backpressure_signal = true"
]
on_error = [
    "No credit deducted",
    "Backpressure signal may be propagated upstream"
]

[interfaces.IF-MESH-006.behavior]
idempotent = false
blocking = false
timeout = "N/A (immediate return)"
concurrency = "thread-safe (atomic operations)"

[interfaces.IF-MESH-006.performance]
operation_latency = "0.001ms (atomic)"
contention = "minimal (lock-free)"

[interfaces.IF-MESH-006.flow_control_config]
initial_window = 65536 # 64KB
max_window = 1048576 # 1MB
threshold_high = 0.8 # 80% of window
threshold_low = 0.5 # 50% of window

# ============================================================================
# IF-MESH-007: TLS Handshake
# ============================================================================

[interfaces.IF-MESH-007]
name = "TLS Handshake"
id = "IF-MESH-007"
provider = "COMP-MESH-005"
consumer = ["COMP-MESH-001"]
protocol = "QUIC TLS (RFC 9001)"
purpose = "Perform mutual TLS handshake for QUIC connections"

[interfaces.IF-MESH-007.signature]
language = "rust"
definition = """
fn perform_handshake(
    connection: &mut QuinnConnection,
    config: TlsConfig
) -> Result<TlsSession, TlsError>
"""

[interfaces.IF-MESH-007.parameters.config]
type = "TlsConfig"
description = "TLS configuration"
fields = [
    { name = "cert_path", type = "PathBuf", description = "Path to certificate file" },
    { name = "key_path", type = "PathBuf", description = "Path to private key file" },
    { name = "ca_path", type = "PathBuf", description = "Path to CA certificate" },
    { name = "verify_peer", type = "bool", default = "true", description = "Verify peer certificate" },
    { name = "alpn_protocols", type = "Vec<String>", default = "[\"h3\"]", description = "ALPN protocols" }
]

[interfaces.IF-MESH-007.returns]
type = "Result<TlsSession, TlsError>"

[interfaces.IF-MESH-007.returns.success]
type = "TlsSession"
description = "Established TLS session"
fields = [
    { name = "peer_cert", type = "Certificate", description = "Peer certificate" },
    { name = "peer_node_id", type = "NodeID", description = "Peer node identifier (from cert)" },
    { name = "session_ticket", type = "Option<Vec<u8>>", description = "Session ticket for 0-RTT" },
    { name = "cipher_suite", type = "CipherSuite", description = "Negotiated cipher suite" }
]

[interfaces.IF-MESH-007.returns.errors]
types = [
    { name = "CertificateInvalid", description = "Peer certificate invalid or expired", recoverable = false },
    { name = "HandshakeFailed", description = "TLS handshake failed", recoverable = true },
    { name = "ProtocolError", description = "TLS protocol error", recoverable = false }
]

[interfaces.IF-MESH-007.preconditions]
items = [
    "Certificate files exist and readable",
    "Private key matches certificate",
    "CA certificate is valid"
]

[interfaces.IF-MESH-007.postconditions]
on_success = [
    "TLS session established",
    "Peer authenticated (if verify_peer = true)",
    "Session ticket cached for 0-RTT"
]
on_error = [
    "Connection closed",
    "Error logged with peer IP (anonymized)"
]

[interfaces.IF-MESH-007.behavior]
idempotent = false
blocking = true
timeout = "handshake (1-RTT: 100-300ms, 0-RTT: 1-5ms)"
concurrency = "one handshake per connection"

[interfaces.IF-MESH-007.performance]
full_handshake_p50 = "100ms"
full_handshake_p99 = "300ms"
resumed_handshake_p50 = "1ms"
resumed_handshake_p99 = "5ms"

[interfaces.IF-MESH-007.security]
min_tls_version = "1.3"
cipher_suites = [
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_AES_128_GCM_SHA256"
]
certificate_validity_max = "90 days"
session_ticket_lifetime = "24 hours"

# ============================================================================
# Component Interface Mapping
# ============================================================================

[component_interfaces]
COMP-MESH-001 = ["IF-MESH-001", "IF-MESH-002", "IF-MESH-005"]
COMP-MESH-002 = ["IF-MESH-003"]
COMP-MESH-003 = ["IF-MESH-004"]
COMP-MESH-004 = ["IF-MESH-006"]
COMP-MESH-005 = ["IF-MESH-007"]

# ============================================================================
# Error Code Registry
# ============================================================================

[error_codes]
range = "0x0000-0xFFFF"
categories = [
    { prefix = "0x01", name = "Actor Errors", range = "0x0100-0x01FF" },
    { prefix = "0x02", name = "Connection Errors", range = "0x0200-0x02FF" },
    { prefix = "0x03", name = "Flow Control Errors", range = "0x0300-0x03FF" },
    { prefix = "0x04", name = "TLS Errors", range = "0x0400-0x04FF" },
    { prefix = "0x05", name = "Proxy Errors", range = "0x0500-0x05FF" }
]

[error_codes.actor_errors]
ActorNotFound = 0x0101
ActorNotRegistered = 0x0102
ActorMailboxFull = 0x0103

[error_codes.connection_errors]
ConnectionFailed = 0x0201
ConnectionTimeout = 0x0202
PoolExhausted = 0x0203
NodeUnreachable = 0x0204

[error_codes.flow_control_errors]
InsufficientCredit = 0x0301
BackpressureActive = 0x0302
WindowExceeded = 0x0303

[error_codes.tls_errors]
CertificateInvalid = 0x0401
HandshakeFailed = 0x0402
ProtocolError = 0x0403

[error_codes.proxy_errors]
TargetNotResolvable = 0x0501
ProtocolConversionError = 0x0502
ProxyTimeout = 0x0503

# ============================================================================
# Versioning
# ============================================================================

[versioning]
current_version = "1.0.0"
compatibility = "semantic versioning"
stability_guarantee = "Interfaces are stable within major version"

[versioning.deprecation_policy]
notice_period = "6 months"
support_period = "12 months after deprecation"

# ============================================================================
# Compliance
# ============================================================================

[compliance]
ieee_1016_2009 = true
rust_api_guidelines = true
documentation_coverage = "100%"

[compliance.testing]
unit_tests = "required for all interfaces"
integration_tests = "required for cross-component interfaces"
contract_tests = "required for public APIs"

