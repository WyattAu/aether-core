[package]
name = "mesh_spike"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.10"
rustls = "0.21"
rcgen = "0.11"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[[bin]]
name = "node"
path = "src/main.rs"
