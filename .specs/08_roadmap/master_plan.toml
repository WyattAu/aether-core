# =============================================================================
# RISK MITIGATION
# =============================================================================

[[risk]]
id = "RISK-001"
description = "WASM cold start performance targets not met"
probability = "medium"
impact = "high"
mitigation = "Early prototyping in Phase 2, fallback to pool-based prewarming"
contingency_task = "TASK-017"

[[risk]]
id = "RISK-002"
description = "Firecracker snapshot/restore latency exceeds target"
probability = "medium"
impact = "high"
mitigation = "Use UFFD-based lazy restore, evaluate alternative VM managers"
contingency_task = "TASK-025"

[[risk]]
id = "RISK-003"
description = "FoundationDB integration complexity"
probability = "low"
impact = "high"
mitigation = "Abstract storage layer, support multiple backends"
contingency_task = "TASK-042"

[[risk]]
id = "RISK-004"
description = "Security vulnerabilities in WASM runtime"
probability = "medium"
impact = "critical"
mitigation = "Extensive fuzzing, capability enforcement, sandbox hardening"
contingency_task = "TASK-075"

[[risk]]
id = "RISK-005"
description = "Mesh network partitioning edge cases"
probability = "medium"
impact = "medium"
mitigation = "Comprehensive chaos testing, split-brain detection"
contingency_task = "TASK-077"

# =============================================================================
# QUALITY GATES
# =============================================================================

[[quality_gate]]
phase = 1
name = "Foundation Complete"
criteria = [
    "All core types compile",
    "Configuration loads correctly",
    "Logging outputs structured JSON"
]

[[quality_gate]]
phase = 2
name = "WASM Engine Operational"
criteria = [
    "WASM modules execute successfully",
    "Cold start < 50ms",
    "Capability enforcement blocks unauthorized access"
]

[[quality_gate]]
phase = 3
name = "Dual Runtime Ready"
criteria = [
    "Both WASM and OCI containers execute",
    "Firecracker VMs start < 125ms",
    "Jailer isolation verified"
]

[[quality_gate]]
phase = 4
name = "Mesh Network Functional"
criteria = [
    "Multi-node communication works",
    "Message latency < 10ms",
    "Failover occurs within 100ms"
]

[[quality_gate]]
phase = 5
name = "State Management Stable"
criteria = [
    "Actor checkpointing works",
    "Migration preserves state",
    "Transactions are ACID"
]

[[quality_gate]]
phase = 6
name = "CLI & API Ready"
criteria = [
    "All CLI commands work",
    "API is fully documented",
    "Integration tests pass"
]

[[quality_gate]]
phase = 7
name = "Production Observability"
criteria = [
    "Metrics export to Prometheus",
    "Traces export to Jaeger",
    "Health checks respond correctly"
]

[[quality_gate]]
phase = 8
name = "Enterprise Ready"
criteria = [
    "RBAC enforces permissions",
    "Audit logs capture all events",
    "Security audit passes"
]
