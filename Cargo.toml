[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/actor-sdk", "crates/server", "tests"]
exclude = ["enterprise"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Aether Team"]
license = "Apache-2.0"
repository = "https://github.com/WyattAu/aether-core"

[workspace.dependencies]
# Async runtimes
tokio = { version = "1.42", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
monoio = "0.2"

# WASM runtime
wasmtime = "25.0"
wasmtime-wasi = "25.0"

# Networking
quinn = "0.11"
rustls = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rkyv = { version = "0.8", features = ["bytecheck"] }
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.6"

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }

# Internal crates
aether-core = { path = "crates/core" }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
