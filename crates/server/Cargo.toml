[package]
name = "aether-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Aether Server - REST/gRPC API server for the Aether platform"

[[bin]]
name = "aether-server"
path = "src/main.rs"

[dependencies]
aether-core = { workspace = true }
axum = { version = "0.7", features = ["json", "macros", "ws"] }
tokio = { workspace = true, features = ["signal", "rt"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
jsonwebtoken = { version = "9", optional = true }
monoio = { workspace = true, optional = true, features = ["mkdirat", "renameat", "unlinkat"] }

[dev-dependencies]
wat = "1.220"
tempfile = "3"

[features]
default = ["wasm"]
wasm = ["aether-core/wasm"]
sqlite = ["dep:rusqlite"]
jwt = ["dep:jsonwebtoken"]
io_uring = ["dep:monoio"]

[lints]
workspace = true
