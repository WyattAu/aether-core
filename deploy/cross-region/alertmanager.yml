global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "region"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: "warnings"
      repeat_interval: 1h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://localhost:5001/webhook/critical"
        send_resolved: true

  - name: "warnings"
    webhook_configs:
      - url: "http://localhost:5001/webhook/warnings"
        send_resolved: true
