# =============================================================================
# Aether Development Environment
# =============================================================================
#
# Usage:
#   docker compose -f deploy/docker-compose.dev.yml up --build
#
# With persistence backends:
#   docker compose -f deploy/docker-compose.dev.yml --profile streaming up --build
#
# With monitoring:
#   docker compose -f deploy/docker-compose.dev.yml --profile monitoring up --build
#
# All profiles:
#   docker compose -f deploy/docker-compose.dev.yml --profile streaming --profile monitoring up --build
# =============================================================================

services:
  aether-core:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aether-dev
    ports:
      - "8080:8080"    # REST API
      - "50051:50051"  # gRPC
      - "7946:7946"    # Cluster gossip (optional)
    volumes:
      - ../server:/app
    environment:
      - AETHER_STATE_BACKEND=memory
      - AETHER_LOG_LEVEL=debug
      # Uncomment for local clustering
      # - AETHER_CLUSTER_ENABLED=true
      # - AETHER_CLUSTER_NODE_ID=dev-node-1
      # - AETHER_CLUSTER_SEED_NODES=dev-node-1:8080
      # - AETHER_CLUSTER_GOSSIP_PORT=7946
      # - AETHER_CLUSTER_SECRET=dev-cluster-secret
    networks:
      - aether-dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aether-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aether-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - streaming

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: aether-dev-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - aether-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: aether-dev-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - aether-dev
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - monitoring

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  aether-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
