services:
  aether:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aether-prod
    ports:
      - "9000:9000/udp"
      - "9001:9001/tcp"
    volumes:
      - aether-prod-data:/var/lib/aether
      - aether-prod-logs:/var/log/aether
      - /etc/aether/aether.toml:/etc/aether/aether.toml:ro
    environment:
      - AETHER_NODE_ID=${AETHER_NODE_ID:-prod-1}
      - RUST_LOG=info
      - AETHER_CONFIG=/etc/aether/aether.toml
      - AETHER_DATA=/var/lib/aether
      - AETHER_LOGS=/var/log/aether
    restart: unless-stopped
    networks:
      - aether-prod
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "aether-{{.ID}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  aether-prod-data:
    driver: local
  aether-prod-logs:
    driver: local

networks:
  aether-prod:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.30.0.0/16
