apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aether-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aether
    app.kubernetes.io/environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    notifications.argoproj.io/subscribe.on-deployed.slack: aether-staging-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: aether-staging-deployments
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aether
  source:
    repoURL: https://github.com/aether/aether-core.git
    targetRevision: main
    path: deploy/helm/aether
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters:
        - name: image.tag
          forceString: true
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: aether-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
