apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aether-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aether
    app.kubernetes.io/environment: production
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: aether-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: aether-deployments
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aether
  source:
    repoURL: https://github.com/aether/aether-core.git
    targetRevision: main
    path: deploy/helm/aether
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: image.tag
          forceString: true
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: aether-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
