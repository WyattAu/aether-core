{{- if .Values.verticalPodAutoscaler.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "aether.fullname" . }}
  labels:
    {{- include "aether.labels" . | nindent 4 }}
  annotations:
    # Fallback annotation for clusters running older VPA CRD versions
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aether.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.verticalPodAutoscaler.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.verticalPodAutoscaler.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.verticalPodAutoscaler.maxAllowed | nindent 10 }}
{{- end }}
