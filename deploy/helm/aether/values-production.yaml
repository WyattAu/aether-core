replicaCount: 3

podAnnotations:
  environment: production

podLabels:
  environment: production

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

image:
  pullPolicy: IfNotPresent

config:
  logLevel: info
  authEnabled: true
  stateBackend: postgres
  eventBackend: postgres

cluster:
  enabled: true
  gossipPort: 7946
  gossipIntervalSeconds: 1.0
  failureTimeoutSeconds: 3.0
  deadTimeoutSeconds: 10.0
  suspicionMax: 3
  virtualNodes: 150
  transport: http
  migrationEnabled: true
  migrationTimeoutSeconds: 30.0
  migrationDrainTimeoutSeconds: 5.0
  migrationBatchSize: 10

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aether
        app.kubernetes.io/instance: aether-production

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: aether.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aether-production-tls
      hosts:
        - aether.example.com
