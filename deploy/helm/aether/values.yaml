replicaCount: 3

image:
  repository: ghcr.io/aether/aether-core
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051
  gossipPort: 7946
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: aether.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aether-tls
      hosts:
        - aether.local

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# Server configuration
config:
  stateBackend: memory          # "memory", "redis", or "postgres"
  eventBackend: memory          # "memory" or "postgres"
  authEnabled: false
  authSecret: "change-me-in-production"
  authTokenTtl: 3600
  logLevel: info
  metricsEnabled: true
  rateLimitEnabled: false
  rateLimitRps: 100
  rateLimitBurst: 200
  drainTimeoutSeconds: 30

# Clustering configuration
cluster:
  enabled: false                # Set to true for multi-node deployments
  nodeId: ""                    # Auto-generated if empty (uses pod name)
  seedNodes: []                 # List of "host:port" seed nodes (API port)
  gossipPort: 7946              # Port for inter-node gossip protocol
  gossipIntervalSeconds: 1.0
  failureTimeoutSeconds: 3.0
  deadTimeoutSeconds: 10.0
  suspicionMax: 3
  virtualNodes: 150             # Virtual nodes per physical node on hash ring
  transport: http               # "http" or "grpc"
  clusterSecret: "change-me-cluster-secret"
  # Actor migration
  migrationEnabled: true
  migrationTimeoutSeconds: 30.0
  migrationDrainTimeoutSeconds: 5.0
  migrationBatchSize: 10

# PostgreSQL configuration (used when stateBackend or eventBackend is "postgres")
postgres:
  url: ""                       # e.g. "postgresql://aether:aether@postgres:5432/aether"
  poolMinSize: 2
  poolMaxSize: 10
  # Set to true to deploy a PostgreSQL instance alongside the server
  enabled: false

# Redis configuration (used when stateBackend is "redis")
redis:
  url: ""                       # e.g. "redis://redis:6379/0"
  keyPrefix: "aether:state:"
  # Set to true to deploy a Redis instance alongside the server
  enabled: false

monitoring:
  prometheus:
    enabled: true
    port: 8080
    path: "/metrics"

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
