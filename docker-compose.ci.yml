# Aether Core - FDB + Multi-Node Integration Testing
# Usage: docker compose -f docker-compose.ci.yml up --abort-on-container-exit
# Then run: cargo test --workspace --features fdb
#            cargo test --test integration --all-features

version: '3.8'

services:
  foundationdb:
    image: foundationdb/foundationdb:7.3
    environment:
      FDB_NETWORK_OPTION_TRACE_LOG_LEVEL: "5"
      FDB_NETWORK_OPTION_TRACE_ENABLE: "1"
    ports:
      - "4500:4500"  # FDB cluster
      - "4501:4501"  # FDB coordination
    volumes:
      - fdb-data:/var/lib/foundationdb
    healthcheck:
      test: ["CMD", "fdbcli", "--exec", "status", "--json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restarts: unless-stopped

  aether-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "sleep 30 &&
      ./target/release/aether --dev --port 19001 --mesh-port 19002 || true"
    ports:
      - "19001:19001"  # HTTP
      - "19002:19002"  # Mesh QUIC
    environment:
      - AETHER_NODE_ID=node-0
      - AETHER_MESH_LISTEN=0.0.0.0:19002
      - AETHER_CLUSTER_SEEDS=node-0:0.0.0.0:19002
    depends_on:
      foundationdb:
        condition: service_healthy

  aether-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "sleep 30 &&
      ./target/release/aether --dev --port 19003 --mesh-port 19004 || true"
    ports:
      - "19003:19003"  # HTTP
      - "19004:19004"  # Mesh QUIC
    environment:
      - AETHER_NODE_ID=node-1
      - AETHER_MESH_LISTEN=0.0.0.0:19004
      - AETHER_CLUSTER_SEEDS=node-0:0.0.0.0:19002
    depends_on:
      aether-node-1:
        condition: service_started

  aether-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "sleep 30 &&
      ./target/release/aether --dev --port 19005 --mesh-port 19006 || true"
    ports:
      - "19005:19005"  # HTTP
      - "19006:19006"  # Mesh QUIC
    environment:
      - AETHER_NODE_ID=node-2
      - AETHER_MESH_LISTEN=0.0.0.0:19006
      - AETHER_CLUSTER_SEEDS=node-0:0.0.0.0:19002
    depends_on:
      aether-node-2:
        condition: service_started

volumes:
  fdb-data:
