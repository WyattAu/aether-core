site_name: Project Aether Documentation
site_description: Post-Container Application OS -- WASM actor runtime with QUIC mesh, zero-trust security, and distributed state
site_url: https://aether.dev
repo_url: https://github.com/WyattAu/aether-core
repo_name: WyattAu/aether-core

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    code: JetBrains Mono
    text: Space Grotesk
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
    - Introduction: getting-started/introduction.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Tutorial: getting-started/tutorial.md
    - Core Concepts: getting-started/concepts.md
    - Best Practices: getting-started/best-practices.md
  - Architecture:
    - Overview: architecture/overview.md
    - Actor Model: architecture/actor-model.md
    - Mesh Network: architecture/mesh.md
    - Security: architecture/security.md
  - SDKs:
    - Overview: sdks/overview.md
    - Go SDK: sdks/go.md
    - Python SDK: sdks/python.md
    - JavaScript SDK: sdks/javascript.md
    - Rust SDK: sdks/rust.md
  - Examples:
    - Overview: examples/overview.md
    - Hello World: examples/hello-world.md
    - Stateful Counter: examples/counter.md
    - AI Actor: examples/ai-actor.md
    - Mesh Communication: examples/mesh.md
    - Chat Application: examples/chat-app.md
    - Resilient Actor: examples/resilient-actor.md
  - Guides:
    - Resilience Patterns: guides/resilience-patterns.md
  - Performance:
    - Overview: performance/overview.md
  - Operations:
    - Runbook: operations/runbook.md
  - API Reference: api-reference.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - toc:
      permalink: true
  - attr_list
  - def_list
  - meta

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WyattAu/aether-core
  version:
    provider: mike

extra_css:
  - styles.css

copyright: Copyright 2026 Project Aether. Apache-2.0 License.
