[package]
name = "ai-actor"
version = "0.1.0"
edition = "2021"
authors = ["Aether Team <team@aether.dev>"]
description = "Example AI-powered actor for Project Aether"

[lib]
crate-type = ["cdylib"]

[dependencies]
aether-core = { path = "../../crates/core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
