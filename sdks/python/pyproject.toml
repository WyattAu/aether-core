[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-sdk"
dynamic = ["version"]
description = "Python SDK for Aether Actor Runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/WyattAu/aether-core"
Documentation = "https://github.com/WyattAu/aether-core#readme"
Repository = "https://github.com/WyattAu/aether-core"
"Bug Tracker" = "https://github.com/WyattAu/aether-core/issues"

[project.optional-dependencies]
grpc = [
    "grpcio>=1.60.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.2.0",
    "mypy>=1.0",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aether_sdk*"]

[tool.setuptools.dynamic]
version = {attr = "aether_sdk._version.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
