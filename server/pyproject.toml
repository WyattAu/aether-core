[project]
name = "aether-server"
version = "0.1.0"
description = "Aether reference server implementation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "websockets"]
