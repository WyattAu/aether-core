version: '3.8'

services:
  aether-node-1:
    build:
      context: ../..
      dockerfile: tests/integration/docker/Dockerfile.test
    command: ["aether", "run", "--node-id", "node-1", "--http-port", "8000", "--mesh-port", "7000"]
    ports:
      - "8001:8000"
      - "7001:7000"
    environment:
      - AETHER_NODE_ID=node-1
      - AETHER_HTTP_PORT=8000
      - AETHER_MESH_PORT=7000
      - AETHER_MESH_SEEDS=node-2:7000,node-3:7000
      - AETHER_FDB_CLUSTER_FILE=/etc/fdb/fdb.cluster
    depends_on:
      foundationdb:
        condition: service_healthy
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  aether-node-2:
    build:
      context: ../..
      dockerfile: tests/integration/docker/Dockerfile.test
    command: ["aether", "run", "--node-id", "node-2", "--http-port", "8000", "--mesh-port", "7000"]
    ports:
      - "8002:8000"
      - "7002:7000"
    environment:
      - AETHER_NODE_ID=node-2
      - AETHER_HTTP_PORT=8000
      - AETHER_MESH_PORT=7000
      - AETHER_MESH_SEEDS=node-1:7000,node-3:7000
      - AETHER_FDB_CLUSTER_FILE=/etc/fdb/fdb.cluster
    depends_on:
      foundationdb:
        condition: service_healthy
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  aether-node-3:
    build:
      context: ../..
      dockerfile: tests/integration/docker/Dockerfile.test
    command: ["aether", "run", "--node-id", "node-3", "--http-port", "8000", "--mesh-port", "7000"]
    ports:
      - "8003:8000"
      - "7003:7000"
    environment:
      - AETHER_NODE_ID=node-3
      - AETHER_HTTP_PORT=8000
      - AETHER_MESH_PORT=7000
      - AETHER_MESH_SEEDS=node-1:7000,node-2:7000
      - AETHER_FDB_CLUSTER_FILE=/etc/fdb/fdb.cluster
    depends_on:
      foundationdb:
        condition: service_healthy
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  foundationdb:
    image: foundationdb/foundationdb:7.3.23
    ports:
      - "4500:4500"
    environment:
      - FDB_NETWORKING_MODE=host
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "fdbcli", "--exec", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  aether-net:
    driver: bridge
